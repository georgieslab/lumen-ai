<svg width="256" height="256" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lumenGradFull" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="coreGlowFull" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="specularFull" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Backing for Contrast -->
  <circle cx="50" cy="50" r="48" fill="#090d16" />

  <!-- Outer Orbital Aura -->
  <circle cx="50" cy="50" r="44" stroke="url(#lumenGradFull)" stroke-width="2.5" opacity="0.65" stroke-dasharray="160 12" />

  <!-- Prismatic Aperture Group -->
  <g filter="url(#glowFull)">
    <circle cx="50" cy="50" r="34" stroke="url(#lumenGradFull)" stroke-width="3" fill="#0f172a" fill-opacity="0.6" />
    <line x1="32" y1="32" x2="40" y2="40" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="68" y1="68" x2="60" y2="60" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
    <line x1="68" y1="32" x2="60" y2="40" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="32" y1="68" x2="40" y2="60" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Inner Liquid Glass Core -->
  <circle cx="50" cy="50" r="18" fill="url(#coreGlowFull)" />
  <circle cx="50" cy="50" r="5" fill="#ffffff" />

  <!-- Curved Specular Glint -->
  <path d="M36 30 C40 24 48 22 58 23 C50 25 43 30 40 38 Z" fill="url(#specularFull)" opacity="0.8" />
</svg>
